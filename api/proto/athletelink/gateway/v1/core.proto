syntax = "proto3";

package athletelink.gateway.v1;

import "google/protobuf/timestamp.proto";

option go_package = "gitlab.com/team-anonyms/athelete-link/api-gateway/api/gen/athletelink/gateway/v1;gatewayv1";

// Public Core API. All methods require verified identity; identity is never payload data.
// See docs/contracts/gateway-grpc.md for HTTP mapping and presence rules.
service CoreService {
  rpc GetRequestDetails(GetRequestDetailsRequest) returns (GetRequestDetailsResponse);
  rpc UpdateRequest(UpdateRequestRequest) returns (UpdateRequestResponse);
  rpc SearchNearbyRequests(SearchNearbyRequestsRequest) returns (SearchNearbyRequestsResponse);
  rpc CreateRequest(CreateRequestRequest) returns (CreateRequestResponse);
  rpc RecordRoundResult(RecordRoundResultRequest) returns (RecordRoundResultResponse);
  rpc CompleteRequest(CompleteRequestRequest) returns (CompleteRequestResponse);
  rpc StartRequest(StartRequestRequest) returns (StartRequestResponse);
  rpc OpenRegistration(OpenRegistrationRequest) returns (OpenRegistrationResponse);
  rpc CloseRegistration(CloseRegistrationRequest) returns (CloseRegistrationResponse);
  rpc LeaveRequest(LeaveRequestRequest) returns (LeaveRequestResponse);
  rpc KickParticipant(KickParticipantRequest) returns (KickParticipantResponse);
  rpc JoinRequest(JoinRequestRequest) returns (JoinRequestResponse);
  rpc CancelRequest(CancelRequestRequest) returns (CancelRequestResponse);
  rpc GetAllSports(GetAllSportsRequest) returns (GetAllSportsResponse);
  rpc GetRoundResults(GetRoundResultsRequest) returns (GetRoundResultsResponse);
}

message GetRequestDetailsRequest {
  optional string request_id = 1;
}

message GetRequestDetailsResponse {
  ActivityRequestDetails request = 1;
}

message UpdateRequestRequest {
  optional string request_id = 1;
  optional string title = 2;
  optional string description = 3;
  google.protobuf.Timestamp event_date = 4;
  optional int32 number_of_rounds = 5;
  optional int32 max_players = 6;
}

message UpdateRequestResponse {
  ActivityRequestDetails request = 1;
}

message SearchNearbyRequestsRequest {
  optional double lat = 1;
  optional double lon = 2;
  optional double radius = 3;
  optional int64 sport_id = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
}

message SearchNearbyRequestsResponse {
  repeated ActivityRequestFeed requests = 1;
}

message CreateRequestRequest {
  optional string title = 1;
  optional string description = 2;
  optional int64 sport_id = 3;
  optional int32 max_players = 4;
  google.protobuf.Timestamp event_date = 5;
  optional int32 number_of_rounds = 6;
  optional string address_text = 7;
  optional double latitude = 8;
  optional double longitude = 9;
}

message CreateRequestResponse {
  optional string request_id = 1;
}

message RecordRoundResultRequest {
  optional string request_id = 1;
  optional int32 round_number = 2;
  UuidList winners = 3;
  UuidList losers = 4;
}

message RecordRoundResultResponse {
  RoundResult result = 1;
}

message CompleteRequestRequest {
  optional string request_id = 1;
}

message CompleteRequestResponse {
}

message StartRequestRequest {
  optional string request_id = 1;
}

message StartRequestResponse {
}

message OpenRegistrationRequest {
  optional string request_id = 1;
}

message OpenRegistrationResponse {
}

message CloseRegistrationRequest {
  optional string request_id = 1;
}

message CloseRegistrationResponse {
}

message LeaveRequestRequest {
  optional string request_id = 1;
}

message LeaveRequestResponse {
}

message KickParticipantRequest {
  optional string request_id = 1;
  optional string target_user_id = 2;
}

message KickParticipantResponse {
}

message JoinRequestRequest {
  optional string request_id = 1;
}

message JoinRequestResponse {
}

message CancelRequestRequest {
  optional string request_id = 1;
}

message CancelRequestResponse {
}

message GetAllSportsRequest {
}

message GetAllSportsResponse {
  repeated Sport sports = 1;
}

message GetRoundResultsRequest {
  optional string request_id = 1;
}

message GetRoundResultsResponse {
  repeated RoundResult results = 1;
}

// Message presence distinguishes a missing list from an explicitly empty list.
message UuidList {
  repeated string values = 1;
}

message ParticipantList {
  repeated Participant values = 1;
}

message ActivityRequestDetails {
  optional string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string sport_name = 4;
  optional int32 max_players = 5;
  optional int32 current_players = 6;
  google.protobuf.Timestamp event_date = 7;
  optional string address_text = 8;
  optional int32 number_of_rounds = 9;
  optional double latitude = 10;
  optional double longitude = 11;
  optional ActivityRequestStatus status = 12;
  optional bool registration_open = 13;
  optional string organizer_id = 14;
  ParticipantList participants = 15;
}

message Participant {
  optional string user_id = 1;
  optional ParticipantRole role = 2;
  optional ParticipantStatus status = 3;
  google.protobuf.Timestamp joined_at = 4;
}

message RoundResult {
  optional string id = 1;
  optional string request_id = 2;
  optional int32 round_number = 3;
  UuidList winners = 4;
  UuidList losers = 5;
  optional string recorded_by = 6;
  google.protobuf.Timestamp created_at = 7;
}

message Sport {
  optional int64 id = 1;
  optional string name = 2;
  optional int32 min_players = 3;
  optional int32 max_players = 4;
  optional string icon_url = 5;
}

message ActivityRequestFeed {
  optional string id = 1;
  optional string title = 2;
  optional string sport_name = 3;
  optional int32 max_players = 4;
  optional int32 current_players = 5;
  google.protobuf.Timestamp event_date = 6;
  optional string address_text = 7;
  optional int32 number_of_rounds = 8;
  optional bool registration_open = 9;
  optional double latitude = 10;
  optional double longitude = 11;
}

enum ActivityRequestStatus {
  ACTIVITY_REQUEST_STATUS_UNSPECIFIED = 0;
  ACTIVITY_REQUEST_STATUS_PLANNED = 1;
  ACTIVITY_REQUEST_STATUS_ACTIVE = 2;
  ACTIVITY_REQUEST_STATUS_CONFIRMATION = 3;
  ACTIVITY_REQUEST_STATUS_COMPLETED = 4;
  ACTIVITY_REQUEST_STATUS_CANCELLED = 5;
  ACTIVITY_REQUEST_STATUS_FROZEN = 6;
}

enum ParticipantRole {
  PARTICIPANT_ROLE_UNSPECIFIED = 0;
  PARTICIPANT_ROLE_ORGANIZER = 1;
  PARTICIPANT_ROLE_PLAYER = 2;
}

enum ParticipantStatus {
  PARTICIPANT_STATUS_UNSPECIFIED = 0;
  PARTICIPANT_STATUS_PENDING = 1;
  PARTICIPANT_STATUS_ACCEPTED = 2;
  PARTICIPANT_STATUS_KICKED = 3;
  PARTICIPANT_STATUS_LEFT = 4;
}

// Packed into google.rpc.Status.details for declared, valid Core business errors.
// code is generated from the gRPC status name; raw Core error fields are not exposed.
// message/details are not populated in v1; see docs/contracts/gateway-grpc-metadata-errors.md.
message CoreErrorDetail {
  int32 http_status = 1;
  optional string code = 2;
  optional string message = 3;
  CoreErrorFields details = 4;
  string request_id = 5;
}

// Message presence distinguishes omitted details from an explicitly empty map.
message CoreErrorFields {
  map<string, string> values = 1;
}

// Packed into google.rpc.Status.details for Gateway-owned failures.
message GatewayErrorDetail {
  string code = 1;
  string request_id = 2;
}
