openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8082/api/v1
  description: Generated server url
tags:
- name: Player profiles
  description: API for viewing player profiles and match history
paths:
  /results/by-request/{activityRequestId}:
    get:
      tags:
      - Results
      summary: Get result by activity request
      operationId: getByActivityRequest
      parameters:
      - name: activityRequestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Game result retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GameResultDetailsDto"
        "404":
          description: Game result not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GameResultDetailsDto"
  /rank-tiers:
    get:
      tags:
      - Rank tiers
      summary: Get configured rank thresholds
      operationId: getRankTiers
      responses:
        "200":
          description: Rank thresholds retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankTierDto"
  /players/{userId}:
    get:
      tags:
      - Player profiles
      summary: Get player summary
      operationId: getSummary
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Summary retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerSummaryDto"
        "404":
          description: Player profile not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerSummaryDto"
  /players/{userId}/sports/{sportId}:
    get:
      tags:
      - Player profiles
      summary: Get player statistics for one sport
      operationId: getSportDetails
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sportId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Sport statistics retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerSportDetailsDto"
        "404":
          description: "Player, sport or statistics not found"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerSportDetailsDto"
  /players/{userId}/matches:
    get:
      tags:
      - Player profiles
      summary: Get paginated player match history
      operationId: getMatches
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sportId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "404":
          description: Player profile or sport not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CursorPageDtoPlayerGameHistoryDto"
        "200":
          description: Match history retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CursorPageDtoPlayerGameHistoryDto"
        "400":
          description: Invalid cursor or limit
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CursorPageDtoPlayerGameHistoryDto"
  /leaderboards/{sportId}:
    get:
      tags:
      - Leaderboards
      summary: Get sport leaderboard
      operationId: getLeaderboard
      parameters:
      - name: sportId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Leaderboard retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CursorPageDtoLeaderboardEntryDto"
        "400":
          description: Invalid cursor or limit
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CursorPageDtoLeaderboardEntryDto"
        "404":
          description: Sport not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CursorPageDtoLeaderboardEntryDto"
components:
  schemas:
    GameResultDetailsDto:
      type: object
      properties:
        id:
          type: string
          description: Unique game result ID
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        activityRequestId:
          type: string
          description: ID of the corresponding activity request
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        sportId:
          type: integer
          description: Sport ID
          format: int64
          example: 1
        status:
          type: string
          description: Current status of the game result
          enum:
          - PENDING
          - CONFIRMED
          - DISPUTED
        createdAt:
          type: string
          description: When the result was processed
          format: date-time
          example: 2026-09-04T18:00:00Z
        players:
          type: array
          description: Individual player results
          items:
            $ref: "#/components/schemas/PlayerResultDto"
      description: Detailed information about a game result
    PlayerResultDto:
      type: object
      properties:
        userId:
          type: string
          description: User ID
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        outcome:
          type: string
          description: Match outcome for this player
          enum:
          - WIN
          - LOSS
          - DRAW
        ratingChange:
          type: integer
          description: Rating change after this match
          format: int32
      description: Individual player result within a game
    RankTierDto:
      type: object
      properties:
        name:
          type: string
          description: Rank name
          example: GOLD
        tier:
          type: integer
          description: Tier number from 1 to 3
          format: int32
          example: 1
        scoreMin:
          type: integer
          description: Minimum score included in this rank
          format: int32
          example: 1200
        scoreMax:
          type: integer
          description: Maximum score included in this rank
          format: int32
          example: 1399
      description: Configured score threshold for a rank tier
    PlayerSummaryDto:
      type: object
      properties:
        userId:
          type: string
          description: User ID
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        summary:
          $ref: "#/components/schemas/Summary"
      description: Aggregated player statistics
    Summary:
      type: object
      properties:
        sportsPlayed:
          type: integer
          description: Number of sports played
          format: int64
          example: 2
        gamesPlayed:
          type: integer
          description: Total number of games
          format: int32
          example: 12
        wins:
          type: integer
          description: Total wins
          format: int32
          example: 7
        losses:
          type: integer
          description: Total losses
          format: int32
          example: 4
        draws:
          type: integer
          description: Total draws
          format: int32
          example: 1
      description: Aggregated statistics across all sports
    PlayerSportDetailsDto:
      type: object
      properties:
        userId:
          type: string
          description: User ID
          format: uuid
        sportId:
          type: integer
          description: Sport ID
          format: int64
          example: 1
        sportName:
          type: string
          description: Sport name
          example: Football
        gamesPlayed:
          type: integer
          description: Games played in this sport
          format: int32
          example: 8
        wins:
          type: integer
          description: Wins in this sport
          format: int32
          example: 5
        losses:
          type: integer
          description: Losses in this sport
          format: int32
          example: 2
        draws:
          type: integer
          description: Draws in this sport
          format: int32
          example: 1
        score:
          type: integer
          description: Current score
          format: int32
          example: 1200
        leaderboardPlace:
          type: integer
          description: Current leaderboard place
          format: int64
          example: 7
        rank:
          $ref: "#/components/schemas/RankDto"
      description: Player statistics for one sport
    RankDto:
      type: object
      properties:
        name:
          type: string
          description: Rank name
          example: GOLD
        tier:
          type: integer
          description: Rank tier
          format: int32
          example: 1
        scoreMin:
          type: integer
          description: Minimum score
          format: int32
          example: 1200
        scoreMax:
          type: integer
          description: Maximum score
          format: int32
          example: 1399
      description: Player rank calculated from score
    CursorPageDtoPlayerGameHistoryDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlayerGameHistoryDto"
        nextCursor:
          type: string
        hasNext:
          type: boolean
    PlayerGameHistoryDto:
      type: object
      properties:
        gameResultId:
          type: string
          description: Game result ID
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        sportId:
          type: integer
          description: Sport ID
          format: int64
          example: 1
        outcome:
          type: string
          description: Outcome for this player
          enum:
          - WIN
          - LOSS
          - DRAW
        ratingChange:
          type: integer
          description: Rating change after this match
          format: int32
        createdAt:
          type: string
          description: When the result was processed
          format: date-time
          example: 2026-09-04T18:00:00Z
      description: A single entry in a player's match history
    CursorPageDtoLeaderboardEntryDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntryDto"
        nextCursor:
          type: string
        hasNext:
          type: boolean
    LeaderboardEntryDto:
      type: object
      properties:
        place:
          type: integer
          format: int64
        userId:
          type: string
          format: uuid
        score:
          type: integer
          format: int32
        wins:
          type: integer
          format: int32
        losses:
          type: integer
          format: int32
        draws:
          type: integer
          format: int32
        rank:
          $ref: "#/components/schemas/RankDto"
