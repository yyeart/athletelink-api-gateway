openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8081
  description: Generated server url
tags:
- name: Sports list
  description: API for receiving the list of available sports. Used for rendering
    dropdowns on the frontend.
- name: Game requests
  description: API for creating and managing game requests
paths:
  /requests:
    get:
      tags:
      - Game requests
      summary: Geo-search for requests
      description: "Looks for requests within a specified radius from the given latitude\
        \ and longitude. Optionally, filter by sport type."
      operationId: searchNearbyRequests
      parameters:
      - name: lat
        in: query
        description: Latitude
        required: true
        schema:
          type: number
          format: double
        example: 55.7558
      - name: lon
        in: query
        description: Longitude
        required: true
        schema:
          type: number
          format: double
        example: 37.6173
      - name: radius
        in: query
        description: Radius of search in meters
        required: false
        schema:
          type: number
          format: double
          default: 5000.0
        example: 5000
      - name: sportId
        in: query
        description: Filter by sport type (optional)
        required: false
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityRequestFeedDto"
    post:
      tags:
      - Game requests
      summary: Create new request
      description: Creates a room for the game. The organizer automatically becomes
        the first participant.
      operationId: createRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequestDto"
        required: true
      responses:
        "201":
          description: Request created successfully
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
                  format: uuid
        "400":
          description: "Validation error (e.g., invalid player limit or empty title)"
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
                  format: uuid
  /requests/{id}/leave:
    post:
      tags:
      - Game requests
      summary: Leave request
      description: "Removes user from the request, freeing the spot."
      operationId: leaveRequest
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Player successfully left the request
        "400":
          description: User is not a participant of the request or is the organizer
        "404":
          description: Request/user not found
  /requests/{id}/kick/{targetUserId}:
    post:
      tags:
      - Game requests
      summary: Kick a participant
      description: Kicks a user from the request room. The kicked user will not be
        able to rejoin. Can only be performed by the organizer.
      operationId: kickParticipant
      parameters:
      - name: id
        in: path
        description: UUID of the request
        required: true
        schema:
          type: string
          format: uuid
      - name: targetUserId
        in: path
        description: UUID of the user to kick
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: User successfully kicked
        "400":
          description: "Target user is not a participant, or initiator is not the\
            \ organizer"
  /requests/{id}/join:
    post:
      tags:
      - Game requests
      summary: Join request
      description: Adds user to the list of participants if there are available spots.
      operationId: joinRequest
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Successfully joined
        "400":
          description: "Request is full, has already started, or user was previously\
            \ kicked"
        "404":
          description: Request not found
  /requests/{id}/cancel:
    post:
      tags:
      - Game requests
      summary: Cancel activity request
      description: Cancels the entire activity request. Can only be performed by the
        request organizer.
      operationId: cancelRequest
      parameters:
      - name: id
        in: path
        description: UUID of the request
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Request successfully cancelled
        "400":
          description: "User is not the organizer, or request is already completed/cancelled"
  /sports:
    get:
      tags:
      - Sports list
      summary: Get all sports
      description: Returns a list of all available sports from the database. Used
        for rendering dropdowns on the frontend.
      operationId: getAllSports
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SportDto"
  /requests/{id}:
    get:
      tags:
      - Game requests
      summary: Get request details
      description: Retrieves detailed information about a specific activity request.
      operationId: getRequestDetails
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Request details retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActivityRequestDetailsDto"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActivityRequestDetailsDto"
components:
  schemas:
    CreateActivityRequestDto:
      type: object
      description: Data for creating new request
      properties:
        title:
          type: string
          description: Title of the activity
          example: Litrbol in front of the GUK
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Description of the activity
          example: Beer drinking contest
        sportId:
          type: integer
          format: int64
          description: ID of the sport (from /sports)
          example: 2
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players (set up by the organizer)
          example: 20
        eventDate:
          type: string
          format: date-time
          description: Event date
          example: 2026-12-25T10:00:00Z
        numberOfRounds:
          type: integer
          format: int32
          description: "Number of rounds/sets (e.g. 1 for a regular game, 3 for the\
            \ \"Best of 3\" format)"
          example: 3
          maximum: 10
          minimum: 1
        addressText:
          type: string
          description: Address of the activity
          example: "г. Москва, ул. Константина Царева, 12к1"
          minLength: 1
        latitude:
          type: number
          format: double
          description: Latitude of the activity location
          example: 55.7558
        longitude:
          type: number
          format: double
          description: Longitude of the activity location
          example: 37.6173
      required:
      - addressText
      - eventDate
      - latitude
      - longitude
      - maxPlayers
      - numberOfRounds
      - sportId
      - title
    SportDto:
      type: object
      description: Data transfer object representing a sport category available in
        the system
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the sport
          example: 1
        name:
          type: string
          description: Display name of the sport
          example: Football
        minPlayers:
          type: integer
          format: int32
          description: Absolute minimum number of players required for a match
          example: 10
        maxPlayers:
          type: integer
          format: int32
          description: Absolute maximum number of players allowed for a match
          example: 22
        iconUrl:
          type: string
          description: URL to the sport's icon/image for UI rendering
          example: https://api.athletelink.com/static/icons/football.png
    ActivityRequestFeedDto:
      type: object
      description: Short information about the request to display in the search feed
      properties:
        id:
          type: string
          format: uuid
          description: Unique request ID
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Request title
          example: MAI litrbol in GUK
        sportName:
          type: string
          description: Sport name
          example: Football
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players
          example: 10
        currentPlayers:
          type: integer
          format: int32
          description: Current number of accepted players
          example: 4
        eventDate:
          type: string
          format: date-time
          description: Event start date and time
          example: 2026-09-04T18:00:00Z
        addressText:
          type: string
          description: Textual address for display in the card
          example: "Москва, ул. Константина Царева, 12к1"
        numberOfRounds:
          type: integer
          format: int32
          description: Planned number of rounds/sets
          example: 3
        latitude:
          type: number
          format: double
          description: Latitude (for map marker)
          example: 55.715551
        longitude:
          type: number
          format: double
          description: Longitude (for map marker)
          example: 37.554191
    ActivityRequestDetailsDto:
      type: object
      description: Detailed information about request room
      properties:
        id:
          type: string
          format: uuid
          description: Unique request ID
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Request title
          example: MAI litrbol in GUK
        description:
          type: string
          description: Description
          example: 30
        sportName:
          type: string
          description: Sport name
          example: Football
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players
          example: 10
        currentPlayers:
          type: integer
          format: int32
          description: Current number of accepted players
          example: 4
        eventDate:
          type: string
          format: date-time
          description: Event start date and time
          example: 2026-09-04T18:00:00Z
        addressText:
          type: string
          description: Textual address for display in the card
          example: "Москва, ул. Константина Царева, 12к1"
        numberOfRounds:
          type: integer
          format: int32
          description: Planned number of rounds/sets
          example: 3
        latitude:
          type: number
          format: double
          description: Latitude (for map marker)
          example: 55.715551
        longitude:
          type: number
          format: double
          description: Longitude (for map marker)
          example: 37.554191
        status:
          type: string
          description: Current status of the request
          enum:
          - PLANNED
          - ACTIVE
          - CONFIRMATION
          - COMPLETED
          - CANCELLED
          - FROZEN
        organizerId:
          type: string
          format: uuid
          description: ID of request creator (organizer)
        participants:
          type: array
          description: List of all participants in the room
          items:
            $ref: "#/components/schemas/ParticipantDto"
    ParticipantDto:
      type: object
      description: Information about a specific participant in an activity request
      properties:
        userId:
          type: string
          format: uuid
          description: Unique identifier of the user (used for linking to their public
            profile)
          example: 123e4567-e89b-12d3-a456-426614174000
        role:
          type: string
          description: Role of the user in this specific request
          enum:
          - ORGANIZER
          - PLAYER
          example: PLAYER
        status:
          type: string
          description: Current participation status
          enum:
          - PENDING
          - ACCEPTED
          - KICKED
          - LEFT
          example: ACCEPTED
        joinedAt:
          type: string
          format: date-time
          description: Timestamp when the user joined the request
          example: 2026-09-03T12:00:00Z
